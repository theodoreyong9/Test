name: Profile site

# Publishes the profile page (Profile/) as a site on GitHub Pages:
#   https://<owner>.github.io/<repository>/
# Once, in Settings > Pages, choose « GitHub Actions » as the source.

on:
  push:
    branches: [main]
    paths: [Profile/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Profile
      - id: deployment
        uses: actions/deploy-pages@v4
