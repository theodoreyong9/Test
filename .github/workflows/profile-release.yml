name: Profile release

# Keeps one copy of the profile page: when Profile/index.html changes on the
# default branch, a copy is published as the asset of the release `profile-page`,
# which replaces the one before (the older versions are in the commits).
# The title and the notes of the release are the subject and the body of the
# last commit that touched the page.

on:
  push:
    branches: [main]
    paths: [Profile/index.html]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish the page as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="profile-page"
          # the copy before it, and the dated ones of the earlier workflow, are removed: one profile per repository
          for old in $(gh release list --limit 200 --json tagName --jq '.[].tagName' | grep -E '^profile-page(-|$)' || true); do
            gh release delete "$old" --yes --cleanup-tag
          done
          title="$(git log -1 --format=%s -- Profile/index.html)"
          git log -1 --format=%b -- Profile/index.html \
            | grep -vE '^(Co-Authored-By|Claude-Session):' > notes.md || true
          cp Profile/index.html profil-jdc.html
          gh release create "$tag" profil-jdc.html \
            --target "$GITHUB_SHA" --title "$title" --notes-file notes.md
